name: Weekly SEO Blog Posts

# Runs every Monday at 08:00 UTC. Generates a keyword cluster, a full blog
# post, a comparison post, and an FAQ page for all three brands — one PR
# per brand so review stays manageable.
#
# Required secret: OPENAI_API_KEY
#
# How the topic is chosen:
#   1. If triggered manually with a topic override, that topic is used.
#   2. Otherwise, the current calendar season is detected from the date and
#      used as the topic (e.g. "summer" → the brand's summer seasonal focus).

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 08:00 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic override (leave blank to auto-detect from season)"
        required: false
        default: ""
      brand:
        description: "Run for a single brand only (leave blank for all brands)"
        required: false
        type: choice
        options:
          - ""
          - whisperedatelier
          - deerhuisecret
          - zenlifeforever
        default: ""

jobs:
  # ---------------------------------------------------------------------------
  # Determine which brands to run
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      brands: ${{ steps.pick.outputs.brands }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ inputs.brand }}" ]; then
            echo 'brands=["${{ inputs.brand }}"]' >> $GITHUB_OUTPUT
          else
            echo 'brands=["whisperedatelier","deerhuisecret","zenlifeforever"]' >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Generate content — one job per brand (run in parallel)
  # ---------------------------------------------------------------------------
  seo-content:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        brand: ${{ fromJson(needs.setup.outputs.brands) }}
      fail-fast: false   # a failed brand doesn't cancel the others

    name: "SEO — ${{ matrix.brand }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Detect current season from the calendar date.
      # Pinterest users (and Google searchers) plan 6-8 weeks ahead, so
      # we add one season of lead time for the furniture brand and publish
      # current-season content for fashion brands.
      - name: Detect seasonal topic
        id: topic
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            echo "value=${{ inputs.topic }}" >> $GITHUB_OUTPUT
          else
            SEASON=$(python3 - <<'PY'
          from datetime import datetime
          m = datetime.now().month
          if m in (3, 4, 5):
              print("spring")
          elif m in (6, 7, 8):
              print("summer")
          elif m in (9, 10, 11):
              print("fall")
          else:
              print("winter")
          PY
            )
            echo "value=${SEASON} style and essentials" >> $GITHUB_OUTPUT
          fi

      - name: Run SEO content agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_OUTPUT_DIR: generated
        run: |
          python -m src.main \
            --brand "${{ matrix.brand }}" \
            --agents seo_content \
            --topic "${{ steps.topic.outputs.value }}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "seo-${{ matrix.brand }}-run${{ github.run_number }}"
          path: "generated/${{ matrix.brand }}/seo_content/"
          if-no-files-found: warn
          retention-days: 90

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "content"      --color "0075ca" --description "AI-generated content draft" 2>/dev/null || true
          gh label create "seo"          --color "d93f0b" --description "SEO content" 2>/dev/null || true
          gh label create "ai-generated" --color "e4e669" --description "Generated by Claude AI agent" 2>/dev/null || true

      - name: Create content PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRAND="${{ matrix.brand }}"
          TOPIC="${{ steps.topic.outputs.value }}"
          BRANCH="content/seo-${BRAND}-${DATE}"

          git checkout -b "$BRANCH"
          git add -f generated/
          if git diff --cached --quiet; then
            echo "No content generated — skipping PR."
            exit 0
          fi
          git commit -m "content(seo): ${BRAND} — ${TOPIC} [${DATE}]"
          git push origin "$BRANCH"

          gh pr create \
            --title "SEO Blog: ${BRAND} — ${TOPIC} (${DATE})" \
            --body "$(cat <<PRBODY
## Weekly SEO Content — ${BRAND}

**Topic:** ${TOPIC}
**Date:** ${DATE}
**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

### Files in this PR
| File | Description |
|------|-------------|
| \`cluster-*.md\` | Keyword cluster map — pillar + 8-12 supporting post ideas |
| \`blog-*.md\` | Full ~1 800-word blog post with metadata, FAQ, CTA |
| \`comparison-*.md\` | 'X vs Y' comparison post with tables (high commercial intent) |
| \`faq-*.md\` | FAQ page with JSON-LD schema ready to paste |

### Before merging / publishing
- [ ] Verify keyword targets are relevant to current search volume
- [ ] Check all brand/competitor names are spelled correctly
- [ ] Add real internal links to existing pages on the site
- [ ] Copy to CMS, add images, apply brand formatting
- [ ] Validate any JSON-LD schema blocks at search.google.com/test/rich-results
- [ ] Schedule publish date (Tuesday–Thursday 9-11am local performs best)

> These are AI drafts. A human editor must review before publishing.
PRBODY
)" \
            --base main \
            --head "$BRANCH" \
            --label "content,seo,ai-generated"
