name: Monthly Analytics Review

# Runs on the 1st of every month at 07:00 UTC — before the Monday SEO run
# so the analytics insights are available to inform the week's content.
#
# Generates for ALL brands in one job:
#   - KPI dashboard template (fill in with real data from GA4/GSC/Klaviyo)
#   - Competitor teardowns (one per configured competitor)
#   - Monthly review template
#   - Free-tools setup guide (if not yet set up)
#   - Attribution playbook
#
# Required secret: OPENAI_API_KEY

on:
  schedule:
    - cron: "0 7 1 * *"   # 1st of every month at 07:00 UTC
  workflow_dispatch: {}   # also triggerable manually (no inputs needed)

jobs:
  monthly-analytics:
    name: Monthly Analytics — All Brands
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analytics agent for all brands
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_OUTPUT_DIR: generated
        run: |
          # No --brand flag → runs all brands defined in config/brands.yaml
          python -m src.main --agents analytics

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "analytics-run${{ github.run_number }}"
          path: generated/
          if-no-files-found: warn
          retention-days: 180   # Keep analytics 6 months for trending

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "analytics"    --color "5319e7" --description "Analytics reports" 2>/dev/null || true
          gh label create "monthly"      --color "f9d0c4" --description "Monthly recurring" 2>/dev/null || true
          gh label create "ai-generated" --color "e4e669" --description "Generated by Claude AI agent" 2>/dev/null || true

      - name: Create analytics PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEARMONTH=$(date +%Y-%m)
          BRANCH="content/analytics-${YEARMONTH}"

          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          git add -f generated/
          if git diff --cached --quiet; then
            echo "No content generated — skipping PR."
            exit 0
          fi
          git commit -m "content(analytics): monthly review ${YEARMONTH}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Monthly Analytics Review — $(date +'%B %Y')" \
            --body "$(cat <<PRBODY
## Monthly Analytics Review — $(date +'%B %Y')

**Brands covered:** All (whisperedatelier, deerhuisecret, zenlifeforever)
**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

### Files in this PR (per brand)
| File | Description |
|------|-------------|
| \`kpi-dashboard.md\` | North-star + leading/lagging metrics with free-tool mapping |
| \`competitor-teardown-*.md\` | One teardown per configured competitor |
| \`monthly-review-template.md\` | Fill-in template for your actual monthly numbers |
| \`free-tools-setup-guide.md\` | Step-by-step setup for GA4, GSC, Bing, Clarity, etc. |
| \`attribution-playbook.md\` | UTM setup, post-purchase surveys, GA4 data-driven |

### Monthly review process
1. Pull actuals from GA4, Google Search Console, Klaviyo / your ESP
2. Fill in the \`monthly-review-template.md\` with real numbers
3. Compare against KPI thresholds in \`kpi-dashboard.md\`
4. Review competitor teardowns for new gaps or opportunities
5. Update SEO keyword targets and social content themes for next month
6. Archive this PR (don't delete — trends are visible across months)

### Free analytics tools to check
- [Google Search Console](https://search.google.com/search-console) — clicks, impressions, CTR, positions
- [GA4](https://analytics.google.com) — sessions, conversions, revenue attribution
- [Microsoft Clarity](https://clarity.microsoft.com) — heatmaps, session recordings (free)
- [Bing Webmaster Tools](https://www.bing.com/webmasters) — Bing search performance

> Fill in real data before making strategic decisions. The AI outputs are
> templates and frameworks — not actuals.
PRBODY
)" \
            --base main \
            --head "$BRANCH" \
            --label "analytics,monthly,ai-generated"
