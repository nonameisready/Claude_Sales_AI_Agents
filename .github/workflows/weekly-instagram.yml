name: Weekly Instagram & TikTok Content

# Runs every Wednesday at 08:00 UTC. Generates a 30-day content calendar,
# 5 carousel posts, 5 Reels scripts, 20 viral hooks, and a hashtag strategy
# for all three brands — one PR per brand.
#
# Wednesday is chosen so the content is ready to schedule for the following
# week (best posting windows are Tue–Fri, so review on Wed/Thu → schedule Fri).
#
# Required secret: ANTHROPIC_API_KEY

on:
  schedule:
    - cron: "0 8 * * 3"   # Every Wednesday at 08:00 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Content theme (leave blank to auto-detect from season)"
        required: false
        default: ""
      brand:
        description: "Run for a single brand only (leave blank for all brands)"
        required: false
        type: choice
        options:
          - ""
          - fashion_brand_1
          - fashion_brand_2
          - furniture_brand
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      brands: ${{ steps.pick.outputs.brands }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ inputs.brand }}" ]; then
            echo 'brands=["${{ inputs.brand }}"]' >> $GITHUB_OUTPUT
          else
            echo 'brands=["fashion_brand_1","fashion_brand_2","furniture_brand"]' >> $GITHUB_OUTPUT
          fi

  instagram-content:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        brand: ${{ fromJson(needs.setup.outputs.brands) }}
      fail-fast: false

    name: "Instagram — ${{ matrix.brand }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect seasonal topic
        id: topic
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            echo "value=${{ inputs.topic }}" >> $GITHUB_OUTPUT
          else
            SEASON=$(python3 - <<'PY'
          from datetime import datetime
          m = datetime.now().month
          if m in (3, 4, 5):
              print("spring")
          elif m in (6, 7, 8):
              print("summer")
          elif m in (9, 10, 11):
              print("fall")
          else:
              print("winter")
          PY
            )
            echo "value=${SEASON} collection" >> $GITHUB_OUTPUT
          fi

      - name: Run social media agent (Instagram + TikTok)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_OUTPUT_DIR: generated
        run: |
          python -m src.main \
            --brand "${{ matrix.brand }}" \
            --agents social_media \
            --topic "${{ steps.topic.outputs.value }}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "instagram-${{ matrix.brand }}-run${{ github.run_number }}"
          path: "generated/${{ matrix.brand }}/social_media/"
          if-no-files-found: warn
          retention-days: 90

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "content"      --color "0075ca" --description "AI-generated content draft" 2>/dev/null || true
          gh label create "social-media" --color "0e8a16" --description "Social media content" 2>/dev/null || true
          gh label create "ai-generated" --color "e4e669" --description "Generated by Claude AI agent" 2>/dev/null || true

      - name: Create content PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRAND="${{ matrix.brand }}"
          TOPIC="${{ steps.topic.outputs.value }}"
          BRANCH="content/instagram-${BRAND}-${DATE}"

          git checkout -b "$BRANCH"
          git add -f generated/
          if git diff --cached --quiet; then
            echo "No content generated — skipping PR."
            exit 0
          fi
          git commit -m "content(social): ${BRAND} — ${TOPIC} [${DATE}]"
          git push origin "$BRANCH"

          gh pr create \
            --title "Instagram Content: ${BRAND} — ${TOPIC} (${DATE})" \
            --body "$(cat <<PRBODY
## Weekly Instagram & TikTok Content — ${BRAND}

**Topic / Theme:** ${TOPIC}
**Platforms:** Instagram, TikTok
**Date:** ${DATE}
**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

### Files in this PR
| File | Description |
|------|-------------|
| \`calendar-*.md\` | 30-day Instagram + TikTok content calendar |
| \`hooks-*.md\` | 20 viral hooks + full scripts for the top 3 |
| \`ig-carousels-*.md\` | 5 carousel posts with slide-by-slide copy |
| \`ig-reels-scripts-*.md\` | 5 Reels / TikTok scripts with hooks + timestamps |
| \`hashtags-*.md\` | Tiered hashtag strategy (niche / mid / broad / branded) |

### Scheduling guide
- **Best IG posting times:** Tue–Fri, 9–11am and 6–8pm (audience's local time)
- **Best TikTok posting times:** Tue–Thu, 7–9am and 7–9pm
- **Carousels:** Schedule for weekday mornings (saves happen during commutes)
- **Reels:** Schedule for evenings and weekends (higher Explore reach)
- **Recommended tools:** Later, Planoly, or Buffer (all have free tiers)

### Before scheduling
- [ ] Review all copy for brand voice consistency
- [ ] Verify hashtag counts are still current (use Instagram search)
- [ ] Add product tags / links where applicable
- [ ] Source or create images/video for each post in the calendar
- [ ] Adjust posting dates to avoid brand conflicts or holidays

> These are AI drafts. A human must review before scheduling.
PRBODY
)" \
            --base main \
            --head "$BRANCH" \
            --label "content,social-media,ai-generated"
