name: Run AI Sales Agents (Manual)

# Trigger this from the GitHub Actions UI: Actions → Run AI Sales Agents →
# Run workflow. Fill in the inputs and hit the green button.
#
# Required secret: OPENAI_API_KEY
# (Repository Settings → Secrets and variables → Actions → New repository secret)

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand to run"
        required: true
        type: choice
        options:
          - fashion_brand_1
          - fashion_brand_2
          - furniture_brand
          - all
        default: fashion_brand_1
      agents:
        description: >
          Agents to run (space-separated).
          Options: seo_content social_media technical_seo email_marketing
          analytics cro community_marketing pinterest_seo
        required: false
        default: "seo_content social_media"
      topic:
        description: "Content topic or theme (e.g. 'summer linen collection')"
        required: true
        default: "spring collection"

jobs:
  run-agents:
    name: "${{ inputs.brand }} — ${{ inputs.agents }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agents
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Write output to generated/ (tracked by CI) instead of
          # outputs/ (gitignored for local dev).
          CLAUDE_OUTPUT_DIR: generated
        run: |
          if [ "${{ inputs.brand }}" = "all" ]; then
            python -m src.main \
              --agents ${{ inputs.agents }} \
              --topic "${{ inputs.topic }}"
          else
            python -m src.main \
              --brand "${{ inputs.brand }}" \
              --agents ${{ inputs.agents }} \
              --topic "${{ inputs.topic }}"
          fi

      # Always upload as artifacts — available for 90 days even if the PR
      # is rejected or the branch is deleted.
      - name: Upload generated content as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "content-${{ inputs.brand }}-run${{ github.run_number }}"
          path: generated/
          if-no-files-found: warn
          retention-days: 90

      # Open a PR so a human can review every file before it goes live.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure GitHub labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "content"      --color "0075ca" --description "AI-generated content draft" 2>/dev/null || true
          gh label create "ai-generated" --color "e4e669" --description "Generated by Claude AI agent" 2>/dev/null || true

      - name: Create content PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="content/manual-${{ inputs.brand }}-run${{ github.run_number }}"
          git checkout -b "$BRANCH"
          git add -f generated/
          if git diff --cached --quiet; then
            echo "No content was generated — skipping PR."
            exit 0
          fi
          git commit -m "content(${{ inputs.agents }}): ${{ inputs.brand }} — ${{ inputs.topic }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Content: ${{ inputs.brand }} — ${{ inputs.topic }}" \
            --body "$(cat <<'PRBODY'
## AI-Generated Content — Review Required

| Field | Value |
|-------|-------|
| **Brand** | `${{ inputs.brand }}` |
| **Agents** | `${{ inputs.agents }}` |
| **Topic** | ${{ inputs.topic }} |
| **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

### Review checklist
- [ ] Content is on-voice for the brand
- [ ] No factual errors or hallucinated details
- [ ] SEO title ≤ 60 chars, meta description ≤ 160 chars
- [ ] All CTAs point to real pages on the brand's website
- [ ] JSON-LD schema validated (if Technical SEO agent ran)
- [ ] Emails reviewed for spam triggers before importing to ESP
- [ ] Ready to hand to copyeditor / schedule for publish

> **These are AI drafts. A human must review every file before publishing.**
PRBODY
)" \
            --base main \
            --head "$BRANCH" \
            --label "content,ai-generated"
