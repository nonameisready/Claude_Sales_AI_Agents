# ============================================================================
# Brand Configuration
# ----------------------------------------------------------------------------
# Three real brands. Review every field and adjust anything that doesn't
# match your actual products, pricing, or brand voice. The more accurate
# these details are, the better every agent's output will be.
# ============================================================================

brands:
  # ---------------------------------------------------------------------- #
  # FASHION BRAND #1 — Whispered Atelier                                  #
  # whisperedatelier.com                                                   #
  # ---------------------------------------------------------------------- #
  - id: whisperedatelier
    name: "Whispered Atelier"
    industry: fashion
    website: "https://whisperedatelier.com"
    tagline: "Quietly beautiful. Artisan-crafted fashion for women who let their style speak."
    description: >
      Whispered Atelier is an elegant women's fashion brand built on the
      atelier tradition — considered design, quality fabrics, and pieces
      made to be worn and remembered. The brand speaks softly but with
      intention: understated luxury over trend-chasing.
    target_audience:
      primary: "Women, 25-45, who value quiet sophistication and lasting quality"
      secondary: "Style-conscious professionals who want investment pieces, not fast fashion"
      pain_points:
        - "Tired of trend-driven pieces that feel disposable after one season"
        - "Can't find elegant basics that feel special without being pretentious"
        - "Want clothes that work effortlessly from work to evening"
        - "Overwhelmed by over-designed, logo-heavy fashion"
    usp:
      - "Artisan-crafted construction — not mass produced"
      - "Timeless silhouettes that outlast seasons"
      - "Considered fabric selection: natural fibres, quality drape"
      - "Small-batch production — limited availability"
    voice:
      tone: "Quiet, elegant, confident — like a well-dressed woman who never shouts"
      avoid: "Hype language, trend buzzwords, exclamation marks, over-explaining"
      favorite_words:
        - "considered"
        - "artisan"
        - "understated"
        - "quietly"
        - "crafted"
    competitors:
      - "Sézane"
      - "& Other Stories"
      - "Ba&sh"
      - "Réalisation Par"
    seed_keywords:
      - "artisan women's fashion"
      - "elegant minimalist clothing"
      - "quiet luxury fashion"
      - "investment piece women's clothing"
      - "understated luxury dresses"
      - "capsule wardrobe essentials women"
    seasonal_focus:
      spring: "Silk blouses, lightweight dresses, transitional layering pieces"
      summer: "Linen sets, elegant sundresses, resort wear"
      fall: "Tailored coats, rich-toned knitwear, structured pieces"
      winter: "Luxe knits, evening wear, gift-worthy statement pieces"
    pinterest_boards:
      - "Quiet Luxury Fashion"
      - "Elegant Minimalist Outfits"
      - "Artisan Women's Clothing"
      - "Investment Piece Style"
      - "French Girl Fashion Inspiration"
      - "Work to Evening Outfits"
    reddit_communities:
      - "femalefashionadvice"
      - "capsulewardrobe"
      - "classicfilms"
      - "frugalfemaleadvice"
      - "ethicalfashion"
    google_shopping_category: "Apparel & Accessories > Clothing > Women's Clothing"

  # ---------------------------------------------------------------------- #
  # FASHION BRAND #2 — Deer Huis Secret                                   #
  # deerhuisecret.com                                                      #
  # ---------------------------------------------------------------------- #
  - id: deerhuisecret
    name: "Deer Huis Secret"
    industry: fashion
    website: "https://www.deerhuisecret.com"
    tagline: "Nature-inspired fashion with a hidden story."
    description: >
      Deer Huis Secret is a women's fashion brand with a nature-inspired,
      whimsical aesthetic — think forest light, soft textures, and pieces
      that carry a quiet sense of mystery. "Huis" (Dutch for home) reflects
      the brand's intimate, close-to-nature identity. Romantic prints,
      earthy tones, and considered construction for women who dress with feeling.
    target_audience:
      primary: "Women, 22-40, drawn to nature-inspired, romantic, and whimsical aesthetics"
      secondary: "Cottagecore and dark academia enthusiasts; women who shop independent brands"
      pain_points:
        - "Mainstream fashion feels generic — no personality or story"
        - "Hard to find feminine pieces that aren't over-the-top or fast fashion"
        - "Want clothing that feels connected to nature and slower living"
        - "Can't find romantic prints and textures outside of fast fashion"
    usp:
      - "Nature-inspired prints and earthy colour palettes"
      - "Romantic, whimsical designs not found on the high street"
      - "Independent brand with a distinct creative identity"
      - "Feminine silhouettes for real body shapes"
    voice:
      tone: "Dreamy, warm, intimate — like a secret told between friends in the woods"
      avoid: "Corporate polish, generic fashion speak, anything that feels mass-market"
      favorite_words:
        - "secret"
        - "soft"
        - "forest"
        - "bloom"
        - "wandering"
        - "hidden"
    competitors:
      - "Spell & The Gypsy Collective"
      - "Free People"
      - "Anthropologie"
      - "Selkie"
    seed_keywords:
      - "nature inspired women's fashion"
      - "cottagecore clothing"
      - "romantic floral dresses"
      - "whimsical fashion brand"
      - "earthy tones women's clothing"
      - "boho dress independent brand"
    seasonal_focus:
      spring: "Floral midi dresses, lightweight blouses, pastel earth tones"
      summer: "Printed sundresses, linen separates, nature-walk ready sets"
      fall: "Forest-toned knitwear, romantic velvet, layering in rust and ochre"
      winter: "Cosy textures, deep forest greens and burgundy, festive florals"
    pinterest_boards:
      - "Cottagecore Outfit Ideas"
      - "Romantic Floral Fashion"
      - "Nature Inspired Clothing"
      - "Whimsical Women's Style"
      - "Earthy Tones Wardrobe"
      - "Boho Dress Inspiration"
    reddit_communities:
      - "femalefashionadvice"
      - "cottagecore"
      - "witchesvspatriarchy"
      - "findfashion"
      - "ethicalfashion"
    google_shopping_category: "Apparel & Accessories > Clothing > Women's Clothing"

  # ---------------------------------------------------------------------- #
  # FURNITURE / LIFESTYLE BRAND — Zen Life Forever                        #
  # zenlifeforever.com                                                     #
  # ---------------------------------------------------------------------- #
  - id: zenlifeforever
    name: "Zen Life Forever"
    industry: furniture
    website: "https://www.zenlifeforever.com"
    tagline: "Furniture and living essentials for a calmer, more intentional home."
    description: >
      Zen Life Forever brings mindful, minimalist design to everyday living —
      furniture, home accessories, and lifestyle pieces built around the
      principle that your environment shapes your wellbeing. Clean lines,
      natural materials, and a calm palette designed for modern apartments
      and homes where simplicity is the point.
    target_audience:
      primary: "Adults 25-45 creating a peaceful, intentional home environment"
      secondary: "Minimalism enthusiasts, yoga practitioners, wellness-oriented decorators"
      pain_points:
        - "Most furniture is either cheap and disposable or absurdly expensive"
        - "Hard to find furniture that feels genuinely calm — not just grey IKEA"
        - "Small spaces need furniture that breathes, not bulky pieces"
        - "Want a home that supports a slower, less cluttered lifestyle"
    usp:
      - "Zen-inspired minimalist design language — not just 'neutral'"
      - "Natural materials: bamboo, rattan, solid wood, stone-effect"
      - "Designed for small-to-medium modern living spaces"
      - "Coordinated collections so everything works together"
    voice:
      tone: "Calm, grounded, intentional — speaks like a mindful interior designer"
      avoid: "Urgency marketing, hype, noise, anything that creates anxiety"
      favorite_words:
        - "intentional"
        - "calm"
        - "considered"
        - "balance"
        - "breathe"
        - "natural"
    competitors:
      - "MUJI"
      - "Crate & Barrel"
      - "Article"
      - "Japandi Home"
    seed_keywords:
      - "zen home decor"
      - "minimalist furniture"
      - "japandi style furniture"
      - "calm living room ideas"
      - "natural material furniture"
      - "mindful home design"
      - "small space minimalist furniture"
    seasonal_focus:
      spring: "Refresh and declutter: storage solutions, light natural textures"
      summer: "Indoor-outdoor living, rattan and bamboo, bright natural light"
      fall: "Cosy minimalism: warm natural tones, soft textiles, reading nooks"
      winter: "Hygge-inspired calm: candle stands, soft rugs, bedroom sanctuaries"
    pinterest_boards:
      - "Zen Home Decor Ideas"
      - "Japandi Interior Design"
      - "Minimalist Living Room"
      - "Natural Material Furniture"
      - "Calm Bedroom Design"
      - "Small Space Minimalist Home"
      - "Mindful Home Inspiration"
    reddit_communities:
      - "malelivingspace"
      - "femalelivingspace"
      - "minimalism"
      - "ZenHabits"
      - "InteriorDesign"
      - "smallapartments"
      - "BuyItForLife"
    google_shopping_category: "Furniture > Living Room Furniture"

# ============================================================================
# Global settings shared across all brands
# ============================================================================
global:
  # Where to write generated content (local dev only — CI uses CLAUDE_OUTPUT_DIR)
  output_dir: outputs

  # OpenAI model. gpt-4o is best for long-form content quality.
  # Swap to gpt-4o-mini for ~85% lower cost.
  model: gpt-4o

  # Max output tokens per call. gpt-4o supports up to 16 384.
  max_tokens: 16000
