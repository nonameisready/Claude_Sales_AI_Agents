brands:
  # ---------------------------------------------------------------------- #
  # FASHION BRAND #1                                                       #
  # ---------------------------------------------------------------------- #
  - id: whispered_atelier
    name: "Whispered Atelier"
    industry: fashion
    website: "https://whisperedatelier.com"
    tagline: "Contemporary couture designed to sculpt presence"
    description: >
      A contemporary couture house specializing in made-to-order evening gowns,
      bridal pieces, power silhouettes, cocktail dresses, and statement formalwear.
      The brand blends sculpted structure, romantic detail, and custom-fit service
      for women seeking unforgettable occasion dressing.
    target_audience:
      primary: "Women, 23-45, shopping for prom, gala, bridal, red-carpet, and formal-event dresses"
      secondary: "Fashion-forward women who want custom sizing, couture styling, and statement silhouettes"
      pain_points:
        - "Want a dress that feels designer-level, not mass-market"
        - "Need custom sizing or made-to-order fit confidence"
        - "Want a dramatic, flattering silhouette for a milestone event"
        - "Need occasionwear that stands out in photos and in person"
    usp:
      - "Bespoke made-to-order designs"
      - "Free shipping for each order"
      - "Free virtual fitting via WhatsApp"
      - "Custom sizing available"
      - "Distinct categories across evening, bridal, cocktail, and power dressing"
    voice:
      tone: "Elegant, feminine, sculptural, confident, and editorial"
      avoid: "Fast-fashion language, casual slang, bargain-bin framing, overly generic luxury clichés"
      favorite_words:
        - "couture"
        - "sculpted"
        - "presence"
        - "elegance"
        - "unforgettable"
        - "refined"
    competitors:
      - "Meshki"
      - "House of CB"
      - "Retrofête"
      - "Nadine Merabi"
      - "Sherri Hill"
    seed_keywords:
      - "made to order evening gown"
      - "couture prom dress"
      - "bridal couture gown"
      - "illusion corset evening dress"
      - "luxury gala dress"
      - "statement formalwear"
      - "custom size prom dress"
    seasonal_focus:
      spring: "Prom gowns, wedding guest looks, pastel couture, floral statement dresses"
      summer: "Formal gala silhouettes, destination wedding edits, romantic tulle and satin"
      fall: "Power dressing, jewel-toned evening gowns, editorial occasionwear"
      winter: "Holiday formalwear, black-tie gowns, dramatic sleeves, luxe embellishment"
    pinterest_boards:
      - "Couture Evening Gowns"
      - "Prom Dress Inspiration"
      - "Modern Bridal Couture"
      - "Power Dressing for Women"
      - "Luxury Gala Looks"
      - "Editorial Occasionwear"
      - "Sculpted Corset Dresses"
    reddit_communities:
      - "weddingdress"
      - "female fashion advice"
      - "weddingplanning"
      - "OUTFITS"
      - "frugalwedding"
      - "fashion"
    google_shopping_category: "Apparel & Accessories > Clothing > Dresses"

  # ---------------------------------------------------------------------- #
  # FASHION BRAND #2                                                       #
  # ---------------------------------------------------------------------- #
  - id: deerhui_secret
    name: "DeerHui Secret"
    industry: fashion
    website: "https://www.deerhuisecret.com/"
    tagline: "Elegance reimagined through modern Chinese-inspired design"
    description: >
      DeerHui Secret creates Chinese New Style clothing for modern women,
      translating heritage aesthetics into wearable contemporary pieces.
      The collection spans dresses, jackets, vests, blouses, pants, bags,
      prom styles, and made-to-order pieces, with a strong emphasis on
      mulberry silk, xiangyunsha, jacquard, brocade, and quietly expressive design.
    target_audience:
      primary: "Women, 25-45, drawn to neo-Chinese fashion, artful dressing, and elevated everyday elegance"
      secondary: "Cultural aesthetes, silk lovers, gift buyers, and women seeking distinctive occasion or dailywear pieces"
      pain_points:
        - "Want Chinese-inspired fashion that feels modern, not costume-like"
        - "Need elegant statement pieces that are wearable in real life"
        - "Looking for refined fabrics like silk, jacquard, and brocade"
        - "Want clothing that feels artistic, feminine, and culturally grounded"
    usp:
      - "Chinese New Style clothing for modern daily life"
      - "Strong assortment in mulberry silk and xiangyunsha"
      - "Made-to-order and customization options"
      - "Rooted in Guangxi craftsmanship and local silk supply"
      - "AI-enhanced visual storytelling paired with traditional material heritage"
    voice:
      tone: "Quietly luxurious, poetic, cultured, feminine, and intimate"
      avoid: "Touristy Orientalism, loud trend-chasing, costume framing, heavy jargon"
      favorite_words:
        - "quiet elegance"
        - "modern Chinese style"
        - "wearable art"
        - "refined"
        - "soft power"
        - "heritage"
    competitors:
      - "Mukzin"
      - "SHUSHU/TONG"
      - "Songmont"
      - "Shanghai Tang"
      - "independent neo-Chinese designers on Etsy"
    seed_keywords:
      - "neo chinese dress"
      - "mulberry silk qipao"
      - "xiangyunsha dress"
      - "modern chinese jacket"
      - "jacquard vest women"
      - "new chinese style clothing"
      - "elegant oriental blouse"
    seasonal_focus:
      spring: "Jacquard dresses, light jackets, floral blouses, tea-gathering looks"
      summer: "Sleeveless silk dresses, xiangyunsha, breathable elegance, travel dressing"
      fall: "Brocade jackets, statement vests, layered neo-Chinese outfits"
      winter: "Velvet qipao, rich texture, darker palettes, occasion-ready outerwear"
    pinterest_boards:
      - "Neo Chinese Fashion"
      - "Mulberry Silk Dresses"
      - "Modern Qipao Styling"
      - "Chinese Inspired Jackets"
      - "Quiet Luxury Outfit Ideas"
      - "Artful Everyday Dressing"
      - "Jacquard and Brocade Fashion"
    reddit_communities:
      - "femalefashionadvice"
      - "AsianBeauty"
      - "OUTFITS"
      - "EtsySellers"
      - "oldhagfashion"
      - "fashionwomens35"
    google_shopping_category: "Apparel & Accessories > Clothing"

  # ---------------------------------------------------------------------- #
  # FURNITURE BRAND                                                        #
  # ---------------------------------------------------------------------- #
  - id: zen_life_forever
    name: "Zen Life Forever"
    industry: furniture
    website: "https://www.zenlifeforever.com/"
    tagline: "Calm, natural furniture for grounded everyday living"
    description: >
      Zen Life Forever is positioned as a zen-inspired home brand centered on
      clean lines, warm wood tones, and practical furniture for peaceful,
      uncluttered living spaces. The brand direction suggests minimalist,
      nature-led pieces designed to bring calm, balance, and visual simplicity
      into the home.
    target_audience:
      primary: "Homeowners and renters, 28-50, who want calm, minimalist, natural-feeling interiors"
      secondary: "Buyers furnishing apartments, studios, reading corners, and serene living spaces on a moderate budget"
      pain_points:
        - "Want a peaceful home without overly cold or sterile furniture"
        - "Need practical pieces that work in smaller modern spaces"
        - "Looking for warm, natural materials and simple silhouettes"
        - "Want furniture that feels grounded, timeless, and easy to style"
    usp:
      - "Zen-inspired minimalist aesthetic"
      - "Natural-material visual language"
      - "Designed for calm, uncluttered interiors"
      - "Approachable everyday styling for modern homes"
      - "Brandable across tables, storage, seating, and decor"
    voice:
      tone: "Calm, grounded, warm, reassuring, and minimal"
      avoid: "Overdesigned luxury language, cluttered copy, trend overload, aggressive sales talk"
      favorite_words:
        - "calm"
        - "natural"
        - "grounded"
        - "minimal"
        - "peaceful"
        - "timeless"
    competitors:
      - "Article"
      - "Castlery"
      - "Japandi Supply House"
      - "Muji"
      - "Nathan James"
    seed_keywords:
      - "zen style furniture"
      - "minimalist wood furniture"
      - "japandi furniture"
      - "small space natural furniture"
      - "solid wood dining table"
      - "peaceful home furniture"
    seasonal_focus:
      spring: "Dining refreshes, light wood finishes, entryway updates"
      summer: "Airy rooms, natural textures, simple table styling"
      fall: "Cozy living rooms, reading corners, warm wood storage"
      winter: "Bedroom calm, hosting tables, serene home reset"
    pinterest_boards:
      - "Zen Living Room Ideas"
      - "Japandi Furniture Inspiration"
      - "Minimalist Wood Furniture"
      - "Calm Home Decor"
      - "Small Space Zen Interiors"
      - "Natural Dining Room Ideas"
      - "Peaceful Bedroom Styling"
    reddit_communities:
      - "malelivingspace"
      - "femalelivingspace"
      - "InteriorDesign"
      - "BuyItForLife"
      - "homeowners"
      - "DesignMyRoom"
      - "SmallHome"
